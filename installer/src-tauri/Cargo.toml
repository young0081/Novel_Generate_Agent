[package]
name = "installer"
version = "0.3.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Keep the library name distinct from the app binary and free of words that
# trigger Windows installer-detection heuristics on Cargo's unit-test executable.
name = "novel_app_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

# Native Windows shell APIs: create .lnk shortcuts in-process (no PowerShell) and
# resolve known folders (Desktop/Start-Menu) so OneDrive redirection is honored.
# Pinned to the same major the Tauri stack already resolves, to avoid duplicate
# copies of the `windows` crate in the build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
