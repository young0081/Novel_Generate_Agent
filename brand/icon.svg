<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">墨 · 创作</title>
  <desc id="desc">墨色方底上的朱砂书页与向上生长的笔锋。</desc>
  <defs>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1e332b"/>
      <stop offset="1" stop-color="#071510"/>
    </linearGradient>
    <linearGradient id="paper" x1="0.2" y1="0.1" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff5df"/>
      <stop offset="1" stop-color="#e5cfaa"/>
    </linearGradient>
    <linearGradient id="verm" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e45b3f"/>
      <stop offset="0.5" stop-color="#c43a2c"/>
      <stop offset="1" stop-color="#8e201a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect x="30" y="30" width="964" height="964" rx="204" fill="url(#ink)" filter="url(#shadow)"/>
  <rect x="58" y="58" width="908" height="908" rx="182" fill="none" stroke="#b7c9bd" stroke-opacity="0.14" stroke-width="4"/>

  <!-- two ivory arcs: the negative space is the open manuscript -->
  <path d="M511 820 C422 746 305 687 145 748 C153 636 158 578 190 548 C302 534 409 584 511 683 Z" fill="url(#paper)" filter="url(#shadow)"/>
  <path d="M513 820 C602 746 719 687 879 748 C871 636 866 578 834 548 C722 534 615 584 513 683 Z" fill="url(#paper)" filter="url(#shadow)"/>
  <path d="M511 820 C422 746 305 687 145 748 C153 636 158 578 190 548 C302 534 409 584 511 683 Z" fill="url(#paper)"/>
  <path d="M513 820 C602 746 719 687 879 748 C871 636 866 578 834 548 C722 534 615 584 513 683 Z" fill="url(#paper)"/>

  <!-- cinnabar page edges and the central upward gesture -->
  <path d="M148 750 C282 699 403 733 512 820" fill="none" stroke="#8d211a" stroke-width="78" stroke-linecap="round"/>
  <path d="M876 750 C742 699 621 733 512 820" fill="none" stroke="#8d211a" stroke-width="78" stroke-linecap="round"/>
  <path d="M148 738 C282 687 403 721 512 808" fill="none" stroke="url(#verm)" stroke-width="57" stroke-linecap="round"/>
  <path d="M876 738 C742 687 621 721 512 808" fill="none" stroke="url(#verm)" stroke-width="57" stroke-linecap="round"/>
  <path d="M512 820 C565 713 548 634 501 565 C460 505 493 431 565 360 C616 310 642 248 652 181" fill="none" stroke="#7f2019" stroke-opacity="0.45" stroke-width="82" stroke-linecap="round"/>
  <path d="M512 808 C559 706 544 637 500 570 C464 515 492 444 558 376 C608 324 635 258 647 187" fill="none" stroke="url(#verm)" stroke-width="58" stroke-linecap="round"/>
  <path d="M521 799 C558 700 537 636 505 584 C476 537 496 471 553 405" fill="none" stroke="#ef8060" stroke-opacity="0.46" stroke-width="10" stroke-linecap="round"/>
  <path d="M647 187 C651 163 657 140 665 116 M657 195 C668 170 678 151 690 133 M665 205 C681 183 696 168 710 154" fill="none" stroke="#d64b37" stroke-width="7" stroke-linecap="round"/>

  <!-- the ink pool anchors the mark and keeps the book readable at small sizes -->
  <ellipse cx="512" cy="821" rx="68" ry="56" fill="#a82a21"/>
  <ellipse cx="512" cy="812" rx="49" ry="36" fill="#cf4633" opacity="0.58"/>
  <path d="M474 817 C500 833 527 836 551 819" fill="none" stroke="#ef8060" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
</svg>
